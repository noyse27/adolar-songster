services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: songster
      POSTGRES_PASSWORD: songster
      POSTGRES_DB: adolar_songster
    # No host port mapping: migrate/backend reach this over the compose
    # network at db:5432, they never need the host-mapped port. Mapping it
    # anyway is both a security exposure (see the Synology deployment
    # guide) and a real conflict source - a NAS that already runs another
    # Postgres (Synology's own package, another project) fails to start
    # this container with "address already in use" on 5432. If you need to
    # reach this DB directly from the host for debugging, map a different
    # port, e.g. "15432:5432".
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songster -d adolar_songster"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    working_dir: /app/backend
    command: npm run migrate:up
    environment:
      DATABASE_URL: postgres://songster:songster@db:5432/adolar_songster
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://songster:songster@db:5432/adolar_songster
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADOLAR_BASE_URL: ${ADOLAR_BASE_URL:-}
      ADOLAR_API_TOKEN: ${ADOLAR_API_TOKEN:-}
      ADOLAR_CLIENT_VERSION: ${ADOLAR_CLIENT_VERSION:-0.1.0}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
